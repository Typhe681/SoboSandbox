name: make-pck
on:
  push:
    paths:
      - "pck_files/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Make sure git exists
        run: command -v git || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v5

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Write pack script
        run: |
          cat > /tmp/pack.gd <<'EOF'
          extends SceneTree

          const SRC = "pck_files"
          const OUT = "data.pck"

          var packer := PCKPacker.new()
          var failed := false

          func _init() -> void:
              var err := packer.pck_start(OUT)
              if err != OK:
                  printerr("pck_start failed: ", err)
                  quit(1)
                  return
              _add_dir("")
              if failed:
                  quit(1)
                  return
              err = packer.flush()
              if err != OK:
                  printerr("flush failed: ", err)
                  quit(1)
                  return
              print("wrote ", OUT)
              quit(0)

          func _add_dir(rel: String) -> void:
              var dir_path := SRC if rel == "" else SRC.path_join(rel)
              var d := DirAccess.open(dir_path)
              if d == null:
                  printerr("can't open ", dir_path)
                  failed = true
                  return
              for sub in d.get_directories():
                  _add_dir(rel.path_join(sub))
              for f in d.get_files():
                  var rel_file := rel.path_join(f)
                  var err := packer.add_file("res://" + rel_file, SRC.path_join(rel_file))
                  if err != OK:
                      printerr("add_file failed for ", rel_file, ": ", err)
                      failed = true
          EOF

      - name: Make data.pck
        run: godot --headless --script /tmp/pack.gd

      - name: Commit data.pck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.pck
          git diff --cached --quiet || git commit -m "Make data.pck"
          git push
